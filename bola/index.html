<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script class="js"></script>
    <link rel="stylesheet" href="style.css">
     <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Modelo</title>
  <!-- Google Fonts para uma tipografia clean -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (ícones) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


  </style>
</head>
<body>
  <div class="login-card" role="main" aria-label="Painel de login">
    <!-- cabeçalho -->
    <div class="login-header">
      <div class="icon-logo">
        <i class="fas fa-lock"></i>
      </div>
      <h1>Bem-vindo</h1>
      <p>Entre com suas credenciais</p>
    </div>

    <!-- formulário -->
    <form id="loginForm" novalidate>
      <!-- campo e-mail -->
      <div class="input-group" id="emailGroup">
        <label for="email"><i class="fas fa-envelope" style="margin-right: 6px;"></i> E-mail</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            placeholder="seu@email.com" 
            autocomplete="email"
            required
          >
        </div>
        <div class="error-message" id="emailError">E-mail inválido</div>
      </div>

      <!-- campo senha -->
      <div class="input-group" id="passwordGroup">
        <label for="password"><i class="fas fa-key" style="margin-right: 6px;"></i> Senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            autocomplete="current-password"
            required
            minlength="6"
          >
        </div>
        <div class="error-message" id="passwordError">Mínimo 6 caracteres</div>
      </div>

      <!-- opções -->
      <div class="login-options">
        <label class="remember">
          <input type="checkbox" checked> Lembrar-me
        </label>
        <div class="forgot">
          <a href="#" aria-label="Recuperar senha">Esqueceu a senha?</a>
        </div>
      </div>

      <!-- botão -->
      <button type="submit" class="btn-login" id="loginBtn">
        <span>Entrar</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <!-- mensagem de sucesso (exibida via JS) -->
      <div class="login-success" id="loginSuccess">
        <i class="fas fa-check-circle"></i> Login simulado com sucesso!
      </div>
    </form>

    <!-- rodapé cadastro -->
    <div class="signup-footer">
      Ainda não tem conta? <a href="#">Crie agora</a>
    </div>
  </div>

  <script>
