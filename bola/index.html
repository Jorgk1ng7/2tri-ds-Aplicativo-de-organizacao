<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Modelo</title>

    <!-- BIBLIOTECAS EXTERNAS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ===== SEU CSS ===== -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card" role="main" aria-label="Painel de login">
        <!-- CABEÇALHO -->
        <div class="login-header">
            <div class="icon-logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1 id="panelTitle">Bem-vindo</h1>
            <p id="panelSubtitle">Entre com suas credenciais</p>
        </div>

        <!-- PAINEL LOGIN -->
        <div id="loginPanel">
            <form class="auth-form" id="loginForm" novalidate>
                <!-- E-mail -->
                <div class="input-group" id="emailGroup">
                    <label for="email">
                        <i class="fas fa-envelope" style="margin-right: 6px;"></i> E-mail
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
                    </div>
                    <div class="error-message" id="emailError">E-mail inválido</div>
                </div>

                <!-- Senha -->
                <div class="input-group" id="passwordGroup">
                    <label for="password">
                        <i class="fas fa-key" style="margin-right: 6px;"></i> Senha
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
                    </div>
                    <div class="error-message" id="passwordError">Mínimo 6 caracteres</div>
                </div>

                <!-- Opções -->
                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberCheck" checked> Lembrar-me
                    </label>
                    <div class="forgot">
                        <a href="#" id="forgotLink" aria-label="Recuperar senha">Esqueceu a senha?</a>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Entrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- Mensagem -->
                <div class="login-success" id="loginSuccess">
                    <i class="fas fa-check-circle"></i> 
                    <span id="loginMsgText">Login simulado com sucesso!</span>
                </div>
            </form>

            <div class="signup-footer">
                Ainda não tem conta? <a id="showSignupLink">Criar conta</a>
            </div>
        </div>

        <!-- PAINEL CRIAR CONTA -->
        <div id="signupPanel">
            <form class="auth-form" id="signupForm" novalidate>
                <!-- Nome -->
                <div class="input-group">
                    <label for="signupName">
                        <i class="fas fa-user" style="margin-right:6px;"></i> Nome completo
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Seu nome" required>
                    </div>
                    <div class="error-message" id="signupNameError">Nome é obrigatório</div>
                </div>

                <!-- E-mail -->
                <div class="input-group">
                    <label for="signupEmail">
                        <i class="fas fa-envelope" style="margin-right:6px;"></i> E-mail
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="seu@email.com" required>
                    </div>
                    <div class="error-message" id="signupEmailError">E-mail inválido</div>
                </div>

                <!-- Senha -->
                <div class="input-group">
                    <label for="signupPassword">
                        <i class="fas fa-key" style="margin-right:6px;"></i> Senha
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="error-message" id="signupPasswordError">Mínimo 6 caracteres</div>
                </div>

                <!-- Confirmar senha -->
                <div class="input-group">
                    <label for="signupConfirm">
                        <i class="fas fa-check-circle" style="margin-right:6px;"></i> Confirmar senha
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-check"></i>
                        <input type="password" id="signupConfirm" placeholder="Digite novamente" required minlength="6">
                    </div>
                    <div class="error-message" id="signupConfirmError">As senhas não coincidem</div>
                </div>

                <!-- Botão Criar conta -->
                <button type="submit" class="btn-login" id="signupBtn">
                    <span>Criar conta</span>
                    <i class="fas fa-user-plus"></i>
                </button>

                <!-- Mensagem -->
                <div class="login-success" id="signupSuccess">
                    <i class="fas fa-check-circle"></i> 
                    <span id="signupMsgText">Conta criada com sucesso!</span>
                </div>
            </form>

            <div class="signup-footer">
                Já tem uma conta? <a id="showLoginLink">Entrar</a>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ⚠️ LINK DO JAVASCRIPT (TEM QUE ESTAR AQUI) -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <!-- ⚠️ SE O JS ESTIVER EM OUTRA PASTA, use: src="js/script.js" -->
</body>
</html>
