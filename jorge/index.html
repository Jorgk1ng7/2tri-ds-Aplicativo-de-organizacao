<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Time</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <ul class="nav nav-pills flex-column mb-auto">

            <li class="nav-item">
                <a href="../bola/index.html" class="nav-link active">
                    Login
                </a>
            </li>

            <li class="nav-item">
                <a href="../gu/index.html" class="nav-link">
                    Agendamento Laboratório
                </a>
            </li>

            <li class="nav-item">
                <a href="./index.html" class="nav-link">
                    Central de Avisos
                </a>
            </li>

            <li class="nav-item">
                <a href="../vine/index.html" class="nav-link">
                    Cardápio
                </a>
            </li>

        </ul>

        <hr>

        <!-- PESQUISA -->
        <form class="d-flex" id="searchForm">

            <input class="form-control me-2" type="search" id="searchInput" placeholder="Pesquisar avisos..."
                autocomplete="off">

            <button class="btn btn-outline-success" type="submit">
                🔍
            </button>

        </form>

    </aside>


    <!-- BOTÃO DO MENU MOBILE -->
    <button type="button" class="btn btn-primary mobile-menu-btn" id="menuBtn">
        ☰ Menu
    </button>


    <!-- FUNDO ESCURO DA SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <!-- CONTEÚDO -->
    <main class="content">

        <div class="cards">

            <!-- CARD 1 -->
            <div class="card aviso-card">

                <img src="./IMAGENS/image.png" class="card-img-top" alt="Avisos da direção">

                <div class="card-body">

                    <h5 class="card-title">
                        Avisos da Direção
                    </h5>

                    <p class="card-text">
                        Você tem 1 avisos pendentes.
                    </p>

                    <button type="button" class="btn btn-info" onclick="abrirAviso('direcao')">
                        Ver Aviso
                    </button>

                </div>

            </div>


            <!-- CARD 2 -->
            <div class="card aviso-card">

                <img src="./IMAGENS/PROFESSOR.png" class="card-img-top" alt="Avisos dos professores">

                <div class="card-body">

                    <h5 class="card-title">
                        Avisos Professor
                    </h5>

                    <p class="card-text">
                        Você tem 1 aviso pendente.
                    </p>

                    <button type="button" class="btn btn-info" onclick="abrirAviso('professor')">
                        Ver Aviso
                    </button>

                </div>

            </div>


            <!-- CARD 3 -->
            <div class="card aviso-card">

                <img src="./IMAGENS/image copy.png" class="card-img-top" alt="Avisos para a família">

                <div class="card-body">

                    <h5 class="card-title">
                        Avisos Para a Família
                    </h5>

                    <p class="card-text">
                        Você tem 0 avisos pendentes.
                    </p>

                    <button type="button" class="btn btn-info" onclick="abrirAviso('familia')">
                        Ver Aviso
                    </button>

                </div>  

            </div>

        </div>

    </main>


    <!-- =========================
         JANELA FLUTUANTE
    ========================= -->

    <div class="modal-aviso" id="modalAviso">

        <div class="conteudo-modal">

            <!-- BOTÃO X -->
            <button class="fechar-modal" onclick="fecharAviso()" aria-label="Fechar aviso">
                &times;
            </button>


            <!-- ÍCONE -->
            <div class="icone-modal" id="iconeAviso">
                📢
            </div>


            <!-- TÍTULO -->
            <h2 id="tituloAviso">
                Aviso
            </h2>


            <!-- MENSAGEM -->
            <p id="mensagemAviso">
                Mensagem do aviso.
            </p>


            <!-- BOTÃO -->
            <button class="btn-fechar-modal" onclick="fecharAviso()">
                Fechar
            </button>

        </div>

    </div>


    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
