<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar" id="sidebar">

        <ul class="nav nav-pills flex-column mb-auto">

            <li class="nav-item">
                <a href="../bola/index.html" class="nav-link active">
                    Login
                </a>
            </li>

            <li class="nav-item">
                <a href="../gu/index.html" class="nav-link">
                    Agendamento Laboratório
                </a>
            </li>

            <li class="nav-item">
                <a href="./index.html" class="nav-link">
                    Avisos
                </a>
            </li>

            <li class="nav-item">
                <a href="../vine/index.html" class="nav-link">
                    Cardápio
                </a>
            </li>

        </ul>

        <hr>

        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Pesquisar">

            <button class="btn btn-outline-success" type="submit">
                Pesquisar
            </button>
        </form>

    </aside>

    <button type="button" class="btn btn-primary mobile-menu-btn" id="menuBtn">
        ☰ Menu
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="content">

        <div class="card" style="width: 18rem;">

            <img src="./IMAGENS/image.png" class="card-img-top" alt="Imagem do card">

            <div class="card-body">

                <h5 class="card-title">
                    Avisos da Direção
                </h5>

                <p class="card-text">
                    Você tem 2 avisos pendentes.
                </p>

                <button type="button" class="btn btn-info" onclick="redirecionar()">Visitar Site</button>

            </div>

            <div class="card" style="width: 18rem;">

                <img src="./IMAGENS/PROFESSOR.png" class="card-img-top" alt="Imagem do card">
    
                <div class="card-body">
    
                    <h6 class="card-title">
                     Avisos Professor
                    </h6>
    
                    <p class="card-text">
                        Você tem 1 aviso pendente.
                    </p>
    
                    <button type="button" class="btn btn-info" onclick="mover()">Visitar Site</button>
    
                </div>
        </div>

        <div class="card" style="width: 18rem;">

            <img src="./IMAGENS/image copy.png" class="card-img-top" alt="Imagem do card">

            <div class="card-body">

                <h6 class="card-title">
                 Avisos Para a Família
                </h6>

                <p class="card-text">
                    Você tem 0 aviso pendente.
                </p>

                <button type="button" class="btn btn-info" onclick="ate()">Visitar Site</button>

            </div>
        
    </main>
