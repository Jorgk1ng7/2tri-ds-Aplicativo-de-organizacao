<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">
        <h2>🍽️ Cardápio Escolar</h2>

        <button onclick="mostrarDia('segunda')">Segunda-feira</button>
        <button onclick="mostrarDia('terca')">Terça-feira</button>
        <button onclick="mostrarDia('quarta')">Quarta-feira</button>
        <button onclick="mostrarDia('quinta')">Quinta-feira</button>
        <button onclick="mostrarDia('sexta')">Sexta-feira</button>
    </aside>

    <main class="conteudo">

        <div class="horario">
            <div id="hora">00:00:00</div>
            <div id="data">00/00/0000</div>
        </div>

        <section class="inicio">
            <h1>Cardápio da Semana</h1>
            <p>Confira os horários e lanches disponíveis durante a semana.</p>
        </section>

        <section class="horarios-lanches">
            <h2>🕐 Horários dos Lanches</h2>

            <div class="horario-card">
                <strong>07:00</strong>
                <span>Lanche da manhã</span>
            </div>

            <div class="horario-card">
                <strong>10:00</strong>
                <span>Lanche</span>
            </div>

            <div class="horario-card">
                <strong>12:25</strong>
                <span>Lanche da saída</span>
            </div>
        </section>

        <section id="cardapio">
            <h2>🍴 Cardápio</h2>

            <div id="prato">
                <h3>Selecione um dia</h3>
                <p>Clique em um dos dias no menu para visualizar o lanche.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
